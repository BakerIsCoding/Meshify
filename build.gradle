plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "meshify"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Self-checks run as JavaExec on the main classpath, so the project needs no test dependency.
tasks.register('glbCheck', JavaExec) {
	group = 'verification'
	description = 'Validates the GLB writer output'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.norwood.meshify.export.GlbWriter'
}

tasks.register('boxUvCheck', JavaExec) {
	group = 'verification'
	description = 'Validates the cuboid texture unwrap, upright and flipped'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.norwood.meshify.export.BoxUv'
}

tasks.register('selectionCheck', JavaExec) {
	group = 'verification'
	description = 'Validates resizing the selection one face at a time'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.norwood.meshify.Selection'
	// Loading BlockPos starts Minecraft's logger, which drops a logs/ folder in the working directory.
	workingDir = layout.buildDirectory.get().asFile
}

tasks.register('optionsCheck', JavaExec) {
	group = 'verification'
	description = 'Validates that menu choices survive the trip through the option string'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.norwood.meshify.MeshifyActions'
	workingDir = layout.buildDirectory.get().asFile
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
