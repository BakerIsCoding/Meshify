plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "meshify"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Self-check for the .glb container layout and vertex dedup. A JavaExec on the main
// classpath rather than a test source set, so the project stays free of a test dependency.
tasks.register('glbCheck', JavaExec) {
	group = 'verification'
	description = 'Validates the GLB writer output'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.norwood.meshify.export.GlbWriter'
}

tasks.register('boxUvCheck', JavaExec) {
	group = 'verification'
	description = 'Validates the cuboid texture unwrap, upright and flipped'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.norwood.meshify.export.BoxUv'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
